name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build and check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libglib2.0-dev libgusb-dev libgudev-1.0-dev libpixman-1-dev \
            libssl-dev libcairo2-dev libudev-dev uncrustify cppcheck

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Build and test
        run: make test
